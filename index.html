<!DOCTYPE html>
<html lang="es" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COMING SOON | ZERO SYSTEMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,700;0,900;1,600&family=Space+Grotesk:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', 'Montserrat', sans-serif;
            background-color: #030305;
            color: #ffffff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Canvas de fondo */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 0;
            pointer-events: none;
        }

        /* Halo interactivo seguidor del ratón (sólo desktop/hover) */
        .mouse-light {
            position: fixed;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(168, 85, 247, 0.08) 35%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            mix-blend-mode: screen;
            transition: opacity 0.3s ease, width 0.3s, height 0.3s;
            opacity: 0;
        }

        @media (hover: hover) and (pointer: fine) {
            .mouse-light.active {
                opacity: 1;
            }
        }

        /* Estilo general para letras animadas */
        .kinetic-letter {
            display: inline-block;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s, text-shadow 0.3s;
            cursor: pointer;
            will-change: transform;
            position: relative;
        }

        .kinetic-letter:hover {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(168, 85, 247, 0.6);
        }

        /* Contenedor del Logo Central e Interacción 3D */
        .logo-card-container {
            perspective: 1000px;
            z-index: 10;
        }

        .logo-card {
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, filter 0.3s ease;
            will-change: transform;
        }

        /* Glow dinámico detrás del logo */
        .glow-effect {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, rgba(147, 51, 234, 0.2) 50%, transparent 70%);
            animation: pulseGlow 4s ease-in-out infinite alternate;
            filter: blur(20px);
            opacity: 0.6;
            z-index: -1;
            transition: opacity 0.4s, filter 0.4s;
        }

        @media (min-width: 640px) {
            .glow-effect {
                inset: -20px;
                filter: blur(25px);
            }
        }

        .logo-card-container:hover .glow-effect {
            opacity: 1;
            filter: blur(35px);
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.92); opacity: 0.4; }
            100% { transform: scale(1.12); opacity: 0.8; }
        }

        /* Scanlines estéticas */
        .scanline-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.25;
        }

        /* Estilos del Footer */
        footer {
            position: absolute;
            bottom: 1rem;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        @media (min-width: 640px) {
            footer {
                bottom: 1.5rem;
            }
        }

        .footer-credits {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        @media (min-width: 640px) {
            .footer-credits {
                gap: 0.75rem;
                padding: 0.5rem 1.25rem;
            }
        }

        .footer-credits:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .footer-credits span {
            font-size: 0.65rem;
            text-transform: lowercase;
            letter-spacing: 0.12em;
            color: #888888;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }

        @media (min-width: 640px) {
            .footer-credits span {
                font-size: 0.75rem;
                letter-spacing: 0.15em;
            }
        }

        .zero-systems-logo {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .zero-systems-logo:hover {
            transform: scale(1.05);
        }

        .zero-systems-svg {
            height: 18px;
            width: auto;
            display: block;
        }

        @media (min-width: 640px) {
            .zero-systems-svg {
                height: 24px;
            }
        }

        /* SVG Central animado */
        .hero-svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
            transition: filter 0.3s ease;
        }

        .logo-card-container:hover .hero-svg {
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6));
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-full h-[100dvh] w-full relative overflow-hidden select-none">

    <!-- Fondo interactivo de partículas en canvas -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- Luz flotante seguidora de puntero -->
    <div id="mouse-light" class="mouse-light"></div>
    
    <!-- Overlay de líneas de escaneo estilo minimal cyber/high-tech -->
    <div class="scanline-overlay"></div>

    <!-- Layout principal -->
    <main class="flex flex-col items-center justify-center h-full w-full z-10 px-4 pb-12 sm:pb-16 relative">
        
        <!-- LOGO CENTRAL ZERO SYSTEMS CON REACCIÓN 3D / TILT -->
        <div class="logo-card-container my-4 sm:my-8 cursor-pointer" id="tilt-container">
            <div class="relative group flex items-center justify-center">
                <div class="glow-effect"></div>
                <div id="tilt-card" class="logo-card relative p-3 sm:p-6 rounded-2xl sm:rounded-3xl backdrop-blur-sm flex items-center justify-center">
                    
                    <!-- SVG de ZERO SYSTEMS en el centro -->
                    <svg class="hero-svg max-w-[260px] xs:max-w-[320px] sm:max-w-[440px] md:max-w-[520px]" viewBox="0 0 560 120" xmlns="http://www.w3.org/2000/svg">
                        <!-- Iso/Icono Zero Systems -->
                        <g fill="#FFFFFF">
                            <path d="M20,65 L110,65 C125,65 130,58 135,48 L142,32 C145,25 140,20 128,20 L40,20 C25,20 20,27 15,37 L8,52 C5,59 10,65 20,65 Z" />
                            <path d="M50,95 L140,95 C155,95 160,88 165,78 L172,62 C175,55 170,50 158,50 L70,50 C55,50 50,57 45,67 L38,82 C35,89 40,95 50,95 Z" />
                            <path d="M140,15 L52,105" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
                        </g>
                        <!-- Texto Marca -->
                        <text x="180" y="62" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="2">ZERO SYSTEMS</text>
                        <text x="183" y="94" font-family="'Montserrat', sans-serif" font-weight="600" font-style="italic" font-size="22" fill="#E0E0E0" letter-spacing="7">CERO LÍMITES</text>
                    </svg>

                </div>
            </div>
        </div>

        <!-- Título interactivo 'COMING SOON' con animación de letras independientes -->
        <h1 id="kinetic-title" class="text-3xl xs:text-4xl sm:text-6xl md:text-7xl font-black tracking-wider sm:tracking-widest text-center uppercase flex flex-wrap justify-center gap-x-2 sm:gap-x-6 gap-y-1 mt-2 sm:mt-4 mb-2">
            <!-- Las letras son inyectadas dinámicamente con JavaScript -->
        </h1>

        <!-- Subtítulo / Indicador sutil minimalista -->
        <p id="interactive-hint" class="text-[9px] sm:text-xs tracking-[0.3em] sm:tracking-[0.5em] uppercase text-gray-400 font-light mt-2 sm:mt-4 animate-pulse text-center">
            [ Interactúa con la pantalla ]
        </p>
    </main>

    <!-- FOOTER SOLICITADO -->
    <footer>
        <div class="footer-credits">
            <span>created by</span>
            <a href="https://j05ulr.github.io/ZeroSystems/" target="_blank" rel="noopener noreferrer" class="zero-systems-logo">
                <svg class="zero-systems-svg" viewBox="0 0 560 120" xmlns="http://www.w3.org/2000/svg">
                    <!-- Iso/Icono Zero Systems -->
                    <g fill="#FFFFFF">
                        <path d="M20,65 L110,65 C125,65 130,58 135,48 L142,32 C145,25 140,20 128,20 L40,20 C25,20 20,27 15,37 L8,52 C5,59 10,65 20,65 Z" />
                        <path d="M50,95 L140,95 C155,95 160,88 165,78 L172,62 C175,55 170,50 158,50 L70,50 C55,50 50,57 45,67 L38,82 C35,89 40,95 50,95 Z" />
                        <path d="M140,15 L52,105" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
                    </g>
                    <!-- Texto Marca -->
                    <text x="180" y="62" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="2">ZERO SYSTEMS</text>
                    <text x="183" y="94" font-family="'Montserrat', sans-serif" font-weight="600" font-style="italic" font-size="22" fill="#E0E0E0" letter-spacing="7">CERO LÍMITES</text>
                </svg>
            </a>
        </div>
    </footer>

    <script>
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        
        // Ajustar mensaje interactivo si es táctil
        if (isTouchDevice) {
            const hint = document.getElementById('interactive-hint');
            if (hint) hint.innerText = '[ Toca la pantalla para interactuar ]';
        }

        /* ==========================================
           1. CANVAS DE FONDO REACTIVO (OPTIMIZADO)
           ========================================== */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000, radius: isTouchDevice ? 140 : 200 };

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor(x, y) {
                this.originX = x;
                this.originY = y;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * (isTouchDevice ? 1.5 : 2) + 1;
                this.baseAlpha = Math.random() * 0.35 + 0.1;
                this.alpha = this.baseAlpha;
            }

            update() {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < mouse.radius) {
                    const force = (mouse.radius - dist) / mouse.radius;
                    const angle = Math.atan2(dy, dx);
                    const pushFactor = isTouchDevice ? 35 : 50;
                    const pushX = -Math.cos(angle) * force * pushFactor;
                    const pushY = -Math.sin(angle) * force * pushFactor;

                    this.vx += pushX;
                    this.vy += pushY;
                    this.alpha = Math.min(1, this.baseAlpha + force * 0.8);
                } else {
                    this.alpha += (this.baseAlpha - this.alpha) * 0.05;
                }

                const homeDx = this.originX - this.x;
                const homeDy = this.originY - this.y;
                this.vx += homeDx * 0.03;
                this.vy += homeDy * 0.03;

                this.vx *= 0.85;
                this.vy *= 0.85;

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let particles = [];
        function initParticles() {
            particles = [];
            // Densidad adaptativa: Menos partículas en pantallas pequeñas para optimizar rendimiento
            const baseSpacing = isTouchDevice ? 45 : 35;
            const spacing = Math.max(baseSpacing, Math.floor(Math.min(width, height) / (isTouchDevice ? 18 : 25)));
            
            for (let x = 0; x < width; x += spacing) {
                for (let y = 0; y < height; y += spacing) {
                    particles.push(new Particle(x, y));
                }
            }
        }

        function drawConnections() {
            const maxDist = isTouchDevice ? 55 : 75;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.12;
                        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            mouse.x += (mouse.targetX - mouse.x) * 0.1;
            mouse.y += (mouse.targetY - mouse.y) * 0.1;

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            drawConnections();
            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', resizeCanvas);

        /* ==========================================
           2. TIPOGRAFÍA DINÁMICA DE "COMING SOON"
           ========================================== */
        const titleContainer = document.getElementById('kinetic-title');
        const words = ["COMING", "SOON"];
        let letterElements = [];

        function buildKineticText() {
            titleContainer.innerHTML = '';
            letterElements = [];

            words.forEach((wordText) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'inline-block whitespace-nowrap';

                wordText.split('').forEach((char) => {
                    const letterSpan = document.createElement('span');
                    letterSpan.innerText = char;
                    letterSpan.className = 'kinetic-letter';
                    letterSpan.dataset.char = char;
                    
                    letterSpan.state = {
                        offsetX: 0,
                        offsetY: 0,
                        scale: 1,
                        rotZ: 0
                    };

                    wordSpan.appendChild(letterSpan);
                    letterElements.push(letterSpan);
                });

                titleContainer.appendChild(wordSpan);
            });
        }

        buildKineticText();

        let time = 0;
        function animateTypography() {
            time += 0.035;

            letterElements.forEach((el, index) => {
                const st = el.state;
                
                const waveY = Math.sin(time + index * 0.4) * (isTouchDevice ? 6 : 10);
                const waveX = Math.cos(time * 0.7 + index * 0.3) * (isTouchDevice ? 2.5 : 4);
                const waveRot = Math.sin(time * 0.5 + index * 0.2) * (isTouchDevice ? 4 : 6);

                const rect = el.getBoundingClientRect();
                const letterCenterX = rect.left + rect.width / 2;
                const letterCenterY = rect.top + rect.height / 2;

                const dx = mouse.x - letterCenterX;
                const dy = mouse.y - letterCenterY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxRepelDist = isTouchDevice ? 90 : 140;

                let repelX = 0;
                let repelY = 0;
                let repelScale = 1;
                let repelRotZ = 0;

                if (dist < maxRepelDist) {
                    const factor = (1 - dist / maxRepelDist);
                    const angle = Math.atan2(dy, dx);
                    const repelForce = isTouchDevice ? 35 : 55;
                    repelX = -Math.cos(angle) * factor * repelForce;
                    repelY = -Math.sin(angle) * factor * repelForce;
                    repelScale = 1 + factor * (isTouchDevice ? 0.2 : 0.35);
                    repelRotZ = -Math.cos(angle) * factor * (isTouchDevice ? 12 : 20);
                }

                st.offsetX += (repelX - st.offsetX) * 0.15;
                st.offsetY += (repelY - st.offsetY) * 0.15;
                st.scale += (repelScale - st.scale) * 0.15;
                st.rotZ += (repelRotZ - st.rotZ) * 0.15;

                const totalX = waveX + st.offsetX;
                const totalY = waveY + st.offsetY;
                const totalRot = waveRot + st.rotZ;

                el.style.transform = `translate3d(${totalX}px, ${totalY}px, 0px) scale(${st.scale}) rotate(${totalRot}deg)`;
            });

            requestAnimationFrame(animateTypography);
        }

        /* ==========================================
           3. INTERACCIÓN DE RATÓN Y TILT 3D LOGO
           ========================================== */
        const mouseLight = document.getElementById('mouse-light');
        const tiltContainer = document.getElementById('tilt-container');
        const tiltCard = document.getElementById('tilt-card');

        let touchTimeout;

        function handlePointerMove(e) {
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (clientX !== undefined && clientY !== undefined) {
                mouse.targetX = clientX;
                mouse.targetY = clientY;

                if (!isTouchDevice) {
                    mouseLight.classList.add('active');
                    mouseLight.style.left = `${clientX}px`;
                    mouseLight.style.top = `${clientY}px`;
                }

                // Tilt 3D
                const rect = tiltContainer.getBoundingClientRect();
                const cardCenterX = rect.left + rect.width / 2;
                const cardCenterY = rect.top + rect.height / 2;

                const cardDx = clientX - cardCenterX;
                const cardDy = clientY - cardCenterY;

                const maxRotation = isTouchDevice ? 10 : 20;
                const rotateX = (-cardDy / (rect.height / 2)) * maxRotation;
                const rotateY = (cardDx / (rect.width / 2)) * maxRotation;

                const scaleVal = isTouchDevice ? 1.03 : 1.06;
                tiltCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(${scaleVal}, ${scaleVal}, ${scaleVal})`;

                // Si es táctil, resetear posición después de dejar de tocar
                if (isTouchDevice) {
                    clearTimeout(touchTimeout);
                    touchTimeout = setTimeout(handlePointerLeave, 1500);
                }
            }
        }

        function handlePointerLeave() {
            mouse.targetX = -1000;
            mouse.targetY = -1000;
            mouseLight.classList.remove('active');
            tiltCard.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        }

        // Listeners adaptativos
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('touchstart', handlePointerMove, { passive: true });
        window.addEventListener('touchmove', handlePointerMove, { passive: true });
        window.addEventListener('touchend', handlePointerLeave);
        document.body.addEventListener('mouseleave', handlePointerLeave);

        /* ==========================================
           4. INICIALIZACIÓN
           ========================================== */
        window.onload = function() {
            resizeCanvas();
            animateCanvas();
            animateTypography();
        };
    </script>
</body>
</html>
